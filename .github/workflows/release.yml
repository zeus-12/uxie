name: Release

# How to cut a release:
#   1. From main: `pnpm release 0.1.1` (bumps apps/desktop, commits, tags, pushes).
#   The tag push triggers this workflow, builds the macOS DMG, and publishes a
#   GitHub Release with it attached.
#
# You can also trigger a manual *test* build from the Actions tab
# (workflow_dispatch). Manual runs build the DMG and attach it as a run
# artifact, but do NOT publish a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Cancel an in-flight run if a newer one starts for the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # required to create the GitHub Release

jobs:
  build:
    name: Build (arm64)
    # Apple Silicon only, matching the local dev target.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION"
          (cd apps/desktop && npm pkg set version="$VERSION")

      - name: Build app bundle
        run: pnpm --filter @uxie/desktop exec electron-vite build

      - name: Package DMG
        env:
          # No Apple Developer ID yet — build unsigned rather than letting
          # electron-builder hunt for (and fail on) a signing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: >
          pnpm --filter @uxie/desktop exec electron-builder
          --mac dmg --arm64 --publish never

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-arm64
          path: apps/desktop/dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Refuse to publish a tag that doesn't point at a commit on main.
      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tag $GITHUB_REF_NAME is not on main — refusing to publish"
            exit 1
          fi

      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
